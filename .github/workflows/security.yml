name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # gitleaks-action lists the commits of a pull request through the API; without this
  # the scan fails on pull_request events.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organizations need a free license key: GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
