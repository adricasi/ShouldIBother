[project]
name = "sib-training"
version = "0.1.0"
description = "QLoRA fine-tune tooling for the Should I Bother? bookmaker (offline, runs on the builder's GPU)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.1",
]
train = [
  "accelerate==1.15.0",
  "bitsandbytes==0.50.2",
  "datasets==5.1.0",
  "peft==0.21.2",
  "torch==2.14.1",
  "transformers==5.20.2",
  "trl==1.16.0",
]

[tool.uv]
# Scripts, not a distributable package: nothing is built, so no unhashed build dependencies.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
