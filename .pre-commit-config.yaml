# Hooks are pinned by commit SHA (the tag in the comment). Update with
# `pre-commit autoupdate --freeze` and review the diff.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx --no-install prettier --check --ignore-unknown
        language: system
        types_or: [ts, javascript, json, yaml, markdown]
      - id: eslint
        name: eslint
        entry: npx --no-install eslint
        language: system
        types_or: [ts, javascript]
