version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint supports only TypeScript <6.1; a major bump breaks npm ci (ERESOLVE).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must match the Node major pinned in engines and .nvmrc (24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /training
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
